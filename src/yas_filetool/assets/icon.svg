<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E59B0D"/>
      <stop offset="1" stop-color="#CC8205"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#F0A020"/>
    </linearGradient>
    <linearGradient id="videoScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42A5F5"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="photoSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81D4FA"/>
      <stop offset="1" stop-color="#B3E5FC"/>
    </linearGradient>
  </defs>

  <!-- Задняя стенка папки -->
  <path d="M 28 100 H 85 L 95 115 H 192 Q 200 115 200 123
           V 212 Q 200 220 192 220 H 28 Q 20 220 20 212
           V 108 Q 20 100 28 100 Z"
        fill="url(#folderBack)"/>

  <!-- Документ (самый нижний слой) -->
  <g>
    <path d="M 79 85 H 158 L 170 97 V 141 Q 170 145 166 145
             H 79 Q 75 145 75 141 V 89 Q 75 85 79 85 Z"
          fill="#FFFFFF" stroke="#DDE3E8" stroke-width="1.2"/>
    <path d="M 158 85 L 170 85 L 170 97 Z"
          fill="#E8EEF2" stroke="#DDE3E8" stroke-width="1" stroke-linejoin="round"/>
    <rect x="82" y="102" width="80" height="5" rx="2" fill="#42A5F5"/>
    <rect x="82" y="113" width="70" height="4" rx="2" fill="#B0BEC5"/>
    <rect x="82" y="122" width="60" height="4" rx="2" fill="#B0BEC5"/>
    <rect x="82" y="131" width="45" height="4" rx="2" fill="#B0BEC5"/>
  </g>

  <!-- Фотография (средний слой, слева, под углом) -->
  <g transform="rotate(-15 80 87.5)">
    <rect x="35" y="50" width="90" height="75" rx="4"
          fill="#FFFFFF" stroke="#DDE3E8" stroke-width="1.2"/>
    <rect x="41" y="56" width="78" height="63" rx="2" fill="url(#photoSky)"/>
    <circle cx="56" cy="71" r="6" fill="#FFD54F"/>
    <path d="M 41 119 L 63 85 L 79 105 L 89 90 L 119 119 Z" fill="#66BB6A"/>
    <path d="M 41 119 L 61 95 L 76 110 L 86 100 L 110 119 Z"
          fill="#388E3C" opacity="0.7"/>
  </g>

  <!-- Видео (верхний слой, справа сверху): кинолента + синий экран -->
  <g transform="rotate(10 158 70.5)">
    <rect x="118" y="38" width="80" height="65" rx="5" fill="#212121"/>
    <!-- перфорация сверху -->
    <rect x="123" y="41" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="137" y="41" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="151" y="41" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="165" y="41" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="179" y="41" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <!-- перфорация снизу -->
    <rect x="123" y="96" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="137" y="96" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="151" y="96" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="165" y="96" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="179" y="96" width="7" height="4" rx="1" fill="#FFFFFF"/>
    <!-- синий градиентный экран -->
    <rect x="122" y="48" width="72" height="44" rx="3" fill="url(#videoScreen)"/>
    <!-- белый треугольник play -->
    <path d="M 151 59 L 151 81 L 169 70 Z" fill="#FFFFFF"/>
  </g>

  <!-- Передняя стенка папки -->
  <rect x="20" y="135" width="180" height="85" rx="10" fill="url(#folderFront)"/>
  <rect x="30" y="143" width="160" height="3" rx="1.5" fill="#FFE0A3" opacity="0.6"/>

  <!-- Гаечный ключ (заходит на папку) -->
  <g transform="translate(178 175) rotate(-40)">
    <rect x="-6" y="-20" width="12" height="64" rx="6" fill="#546E7A"/>
    <path d="M 6 -46.83 A 16 16 0 1 1 -6 -46.83 L -6 -38 L 6 -38 Z" fill="#546E7A"/>
    <rect x="-3" y="-16" width="3" height="48" rx="1.5" fill="#78909C" opacity="0.55"/>
  </g>
</svg>